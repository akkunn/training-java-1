server {
    listen 80;
    server_name learnforgelab.com;

    # Let's Encryptのドメイン所有確認用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Spring Boot
    location / {
        proxy_pass http://app:8080;
    }
}

server {
    listen 443 ssl;
    server_name learnforgelab.com;

    # SSL/TLS証明書
    ssl_certificate /etc/letsencrypt/live/learnforgelab.com/fullchain.pem;

     # 秘密鍵
    ssl_certificate_key /etc/letsencrypt/live/learnforgelab.com/privkey.pem;

    # Spring Bootへ転送
    location / {
        proxy_pass http://app:8080;
    }
}
